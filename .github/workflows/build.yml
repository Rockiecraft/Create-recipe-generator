name: Compile & Create Release Datapack Studio

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Apps on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
    fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile Application Executable Package
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run build:win
          else
            npm run build:linux
          fi
        shell: bash

      - name: Upload Intermediary Build Asset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  create-release:
    name: Package Assets & Draft Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Fetch Artifacts from Previous Builds
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Production Output Files
        run: |
          mkdir dist-final
          find release-artifacts/ -type f \( -name "*.exe" -o -name "*.AppImage" \) -exec cp {} dist-final/ \;
          echo "Listing compiled assets ready for deployment:"
          ls -la dist-final/

      - name: Construct Native GitHub Tag Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-final/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
