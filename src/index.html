<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Create Recipe Generator</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/recipe form/recipe-form.css">
    <link rel="stylesheet" href="css/recipe form/engine-tabs.css">
    <link rel="stylesheet" href="css/recipe form/input-output-blocks.css">
    <link rel="stylesheet" href="css/side-bars/sidebar-left.css">
    <link rel="stylesheet" href="css/side-bars/sidebar-right.css">
</head>
<body>

    <div id="mount-header"></div>

    <main class="workspace-wrapper">
        <div id="mount-sidebar" class="sidebar-left"></div>

        <div class="main-content">
            <div id="mount-engine-tabs"></div>
            <div id="mount-recipe-form"></div>
        </div>

        <div id="mount-right-panel" class="code-preview-sidebar-card"></div>
    </main>

    <div id="mount-footer"></div>
    <div id="mount-modals"></div>

    <script>
        function getItemKey() {
            const ver = document.getElementById('minecraftVersion');
            return (ver && ver.value === '1.21.1') ? 'id' : 'item';
        }
        window.getItemKey = getItemKey;
    </script>

    <!-- Foundation: Data files -->
    <script src="main/js/foundation/compilers/compiler-engines/assembly/assembly-data.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/basins/basin-data.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/filling/filling-data.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/mechanical-crafting/mechanical-crafting-data.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/standard/standard-data.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/timed/timed-data.js"></script>

    <!-- Foundation: Recipe Engines -->
    <script src="main/js/foundation/compilers/compiler-engines/assembly/assembly-recipe-engine.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/basins/basin-recipe-engine.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/filling/filling-recipe-engine.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/mechanical-crafting/mechanicalcrafting-recipe-engine.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/standard/standard-recipe-engine.js"></script>
    <script src="main/js/foundation/compilers/compiler-engines/timed/timed-recipe-engine.js"></script>

    <!-- Foundation: Compiler Core -->
    <script src="main/js/foundation/compilers/compiler-engines/engine-dispatch.js"></script>
    <script src="main/js/foundation/compilers/condition-compiler.js"></script>
    <script src="main/js/foundation/compilers/compiler-core.js"></script>
    <script src="main/js/foundation/Frontend/condition-components/ui-condition-blocks.js"></script>

    <!-- Data -->
    <script src="main/js/foundation/Data/data-reset.js"></script>
    <script src="main/js/foundation/Data/recipe-parser.js"></script>
    <script src="main/js/foundation/Data/recipe-code-line-numbers.js"></script>

    <!-- Frontend: Recipe Compilers -->
    <script src="main/js/foundation/recipe-compilers/recipe-compiler.js"></script>
    <script src="main/js/foundation/recipe-compilers/recipe-isolation.js"></script>
    <script src="main/js/foundation/recipe-compilers/recipe-templates.js"></script>

    <!-- Frontend: UI -->
    <script src="main/js/foundation/Frontend/ui-components.js"></script>
    <script src="main/js/foundation/Frontend/ui-preview.js"></script>
    <script src="main/js/foundation/Frontend/ui-sidebar.js"></script>
    <script src="main/js/foundation/Frontend/ui-router.js"></script>

    <!-- Plugin API (after dispatch/templates exist, before main.js) -->
    <script src="main/js/plugin-api.js"></script>
    <script src="main/js/plugin-schema-api.js"></script>
    <script src="main/js/plugin-schema-custom-field.js"></script>

    <!-- UI panel renderers -->
    <script src="ui/panels/header.js"></script>
    <script src="ui/panels/sidebar.js"></script>
    <script src="ui/panels/engine-tabs.js"></script>
    <script src="ui/panels/recipe-form.js"></script>
    <script src="ui/panels/right-panel.js"></script>
    <script src="ui/panels/footer.js"></script>
    <script src="ui/panels/modals.js"></script>

    <!-- UI loader (mounts panels into the DOM, must run before main.js) -->
    <script src="ui/ui-loader.js"></script>

    <!-- App init -->
    <script src="main/js/main.js"></script>

    <!-- Plugin scripts go here, after the core app has initialized.
         Example: <script src="plugins/my-addon/my-machine.js"></script> -->

</body>
</html>
